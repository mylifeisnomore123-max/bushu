<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Many Happy Returns 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#e8467c;--berry:#a3225a;--plum:#4a1630;--paper:#fffaf7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hind Siliguri',sans-serif;color:var(--plum);overflow:hidden;
  background:radial-gradient(700px 500px at 100% 0,#ffc0d8 0,transparent 60%),radial-gradient(600px 500px at 0 100%,#ffd9e8 0,transparent 60%),linear-gradient(170deg,#fff5f8,#ffdbe9 70%,#ffc9de)}
.script{font-family:'Great Vibes','Caveat','Hind Siliguri',cursive;font-weight:400}
.hand{font-family:'Caveat','Hind Siliguri',cursive}
.grad{background:linear-gradient(100deg,var(--berry),var(--rose) 45%,#ff9ab9);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;bottom:-50px;animation:rise linear forwards;opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.75}100%{transform:translateY(-115vh) rotate(30deg);opacity:0}}
.tw{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 10px 3px #fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.95;transform:scale(1.2)}}
button.btn{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:999px;padding:14px 38px;color:#fff;background:linear-gradient(180deg,#ff6f9f,var(--rose));box-shadow:0 8px 0 var(--berry),0 16px 26px rgba(163,34,90,.3);cursor:pointer;transition:transform .12s,box-shadow .12s}
button.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--berry)}
button:focus-visible{outline:3px solid var(--berry);outline-offset:4px}

/* gate */
#gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
  background:radial-gradient(500px 400px at 50% 38%,#fff 0,transparent 70%),linear-gradient(170deg,#fff5f8,#ffd0e2);transition:opacity .9s .5s,visibility 1.4s}
#gate.gone{opacity:0;visibility:hidden}
.env{position:relative;width:170px;height:118px;margin-bottom:26px;filter:drop-shadow(0 18px 22px rgba(163,34,90,.25));animation:bob 3s ease-in-out infinite}
.gone .env{animation:none}
@keyframes bob{50%{transform:translateY(-9px)}}
.env .back{position:absolute;inset:0;background:#ffb3cd;border-radius:8px}
.env .note{position:absolute;left:14px;right:14px;top:10px;height:86px;background:var(--paper);border-radius:5px;display:grid;place-items:center;font-size:34px;transition:transform .8s .25s cubic-bezier(.3,1.2,.4,1)}
.env .front{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,transparent 49.5%,#ff9fc0 50%) left/51% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#ff8db4 50%) right/51% 100% no-repeat,linear-gradient(#ff7fab,#ff7fab) bottom/100% 55% no-repeat;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62px;background:#ff6f9f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s;z-index:3}
.env .seal{position:absolute;left:50%;top:48px;transform:translateX(-50%);font-size:24px;z-index:4;transition:opacity .3s}
.gone .env .flap{transform:rotateX(180deg);z-index:0}
.gone .env .note{transform:translateY(-62px)}
.gone .env .seal{opacity:0}
#gate h1{font-size:clamp(54px,17vw,88px);line-height:1.02;padding:0 6px}
#gate .ln{width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent);margin:8px auto 22px}

/* intro */
#story{position:fixed;inset:0;z-index:28;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(500px 400px at 50% 40%,#fff 0,transparent 70%),linear-gradient(170deg,#fff5f8,#ffd0e2);opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
#story.on{opacity:1;visibility:visible}
.sl{position:absolute;max-width:520px;padding:0 28px;font-size:clamp(26px,7vw,38px);font-weight:500;line-height:1.55;color:var(--berry);opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}
.sl.show{opacity:1;transform:none}
.skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:inherit;font-size:14px;background:none;border:0;color:var(--berry);opacity:.6;cursor:pointer;padding:8px 14px}

/* stage (story-style frames) */
#stage{position:fixed;inset:0;z-index:2;visibility:hidden}
#stage.show{visibility:visible}
.fr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(64px + env(safe-area-inset-top,0px)) 22px calc(96px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transform:scale(1.05);transition:opacity .7s,transform .7s,visibility .7s}
.fr.on{opacity:1;visibility:visible;transform:none}
#bars{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:70px;display:flex;gap:4px;z-index:6}
.bar{flex:1;height:4px;background:rgba(163,34,90,.22);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--rose)}
.zone{position:fixed;top:70px;bottom:110px;width:24%;z-index:4;border:0;background:none;-webkit-tap-highlight-color:transparent}
.zone.l{left:0}.zone.r{right:0}
body.manual .zone{display:none}
.nv{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:6;width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--berry);font-size:26px;box-shadow:0 6px 16px rgba(163,34,90,.3);cursor:pointer}
#prev{left:20px}#next{right:20px}
#mute{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top,0px));z-index:7;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:19px;box-shadow:0 4px 14px rgba(163,34,90,.3);cursor:pointer;visibility:hidden}
#mute.show{visibility:visible}
#confetti{position:fixed;inset:0;z-index:20;pointer-events:none}

/* hero */
.orb{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 68%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.hero>*:not(.orb){position:relative}
.hero .top{font-size:50px;color:var(--rose);line-height:1}
.hero h2{font-weight:700;font-size:clamp(50px,16vw,80px);line-height:1.12;margin:4px 0 6px}
.hero .nm{font-size:clamp(52px,16vw,80px);color:var(--berry);line-height:1}
.hero .sub{min-height:1.7em;font-size:22px;margin-top:12px}
.cur{display:inline-block;width:2px;height:1em;background:var(--rose);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* photo */
.ph .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.6}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,200,222,.55),rgba(255,235,243,.35) 40%,rgba(255,170,205,.7))}
.ph>*{position:relative}
.pic{width:min(78vw,340px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;border:6px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.35),0 26px 50px rgba(163,34,90,.45);transform:rotate(-2deg)}
.fr:nth-child(even) .pic{transform:rotate(2deg)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.on .pic img{animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.13) translate(-2%,-1%)}}
.ph .cap{margin-top:26px;font-size:46px;font-weight:600;color:var(--berry);line-height:1.1;text-shadow:0 2px 14px rgba(255,255,255,.9)}
.ph .no{margin-top:6px;font-size:15px;color:var(--berry);opacity:.8;letter-spacing:2px}

/* letter */
.paper{position:relative;width:min(92vw,430px);max-height:100%;overflow:auto;background:var(--paper);border-radius:10px;padding:30px 26px 34px;text-align:left;box-shadow:0 20px 40px rgba(163,34,90,.25);
  background-image:repeating-linear-gradient(transparent 0 35px,#f8d5e3 35px 36px);background-position:0 20px}
.paper h3{font-size:44px;color:var(--rose);margin-bottom:6px;line-height:1.1}
.paper p{line-height:36px;font-size:18.5px;margin-bottom:36px;white-space:pre-line}
.paper p:last-child{margin-bottom:0}
.on .paper h3,.on .paper p{animation:up .9s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* balloons */
.fr h3.t{font-size:clamp(38px,11vw,50px);color:var(--rose);line-height:1.15;margin-bottom:10px}
.balloons{position:relative;height:290px;width:min(78vw,320px)}
.bl{position:absolute;width:64px;height:78px;border:0;border-radius:50% 50% 48% 48%;cursor:pointer;animation:flt 3.6s ease-in-out infinite;box-shadow:inset -9px -9px 16px rgba(0,0,0,.1),inset 8px 8px 14px rgba(255,255,255,.4);transition:transform .25s,opacity .25s}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:90px;background:rgba(163,34,90,.35)}
@keyframes flt{50%{transform:translateY(-16px) rotate(3deg)}}
.bl.pop{animation:none;transform:scale(1.7);opacity:0;pointer-events:none}
#pmsg{min-height:2.6em;font-size:32px;color:var(--berry);line-height:1.25}
#pcnt{font-size:14px;opacity:.65}

/* cake */
.cake{width:min(66vw,250px);display:block;overflow:visible;margin:8px auto 0}
.flame{transform-origin:center bottom;transform-box:fill-box;animation:fk .5s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}
.cake.blown .flame{animation:none;opacity:0;transform:scale(.2);transition:opacity .4s,transform .4s}
.cake .smoke{opacity:0}
.cake.blown .smoke{animation:sm 1.6s ease-out forwards}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
#cakeQ{font-size:21px}
#wishmsg{min-height:2.4em;margin-top:6px;font-size:33px;color:var(--berry);line-height:1.2}

/* end */
.end .big{font-size:clamp(50px,15vw,76px);line-height:1.05}
.end p{margin-top:8px;font-size:19px;opacity:.85}
.end .btn{margin-top:26px}

@media (prefers-reduced-motion:reduce){.env,.fl,.tw,.cur,.flame,.orb,.bl{animation:none}.fr,.on .pic img{transition:none;animation:none}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<button id="mute" aria-label="গান বন্ধ বা চালু">🔊</button>

<section id="gate">
  <div class="env" aria-hidden="true"><div class="back"></div><div class="note">💖</div><div class="front"></div><div class="flap"></div><div class="seal">💗</div></div>
  <h1 class="script grad" id="gateTitle"></h1>
  <div class="ln"></div>
  <button class="btn" id="openBtn"></button>
</section>
<section id="story" aria-live="polite"></section>

<div id="stage">
  <div id="bars"></div>
  <button class="zone l" id="zl" aria-label="আগের"></button>
  <button class="zone r" id="zr" aria-label="পরের"></button>
  <button class="nv" id="prev" aria-label="আগের">‹</button>
  <button class="nv" id="next" aria-label="পরের">›</button>
</div>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
/* =====================================================
   ✏️  শুধু এই অংশটা এডিট করো — বাকি কিছু ছুঁতে হবে না
   ===================================================== */
const CONFIG = {
  friendName: "Bushu",

  gateTitle:  "Many Happy Returns!",
  openText:   "খুলে দেখ্‌ 💌",

  intro: [
    "A special day for a very annoying person. 😏"
  ],

  topLine:    "Happy Birthday",
  bigTitle:   "শুভ জন্মদিন",
  typedLine:  "তোকে ❤",

  captions: ["ছোট্ট", "গিটারিস্ট", "পিচ্চু", "আড়চোখা", "নীলিমা", "বসন্ত", "আরও বসন্ত"],
  photoSeconds: 5.5,                  // প্রতিটা ছবি কত সেকেন্ড থাকবে

  letterTitle: "Not-So-Dear Bushu,",
  letter: [
    "জন্মদিনের অনেক অনেক শুভেচ্ছা!",
    "যদি আবার ফিরে আসে, প্রাচীন কোন শুভ্রতায়,\nরজনীগন্ধার মাতাল হাওয়ায়,\nবুকে চেপে অবাধ্য প্রেম...\nতাহলে...............।?"
  ],

  balloonsTitle: "বেলুন ফোটা 🎈",
  balloonMsgs: [
    "তুই তো ভুলেই যাস আমারে 😊",
    "চিঠি দেস না ক্যান? 🌟",
    "হঠাৎ দেখা হবে 🤝",
    "ট্রিট দিবি কিন্তু মনে কইরা 🍫",
    "ভালো থাকিস 💖"
  ],

  cakeQ:    "মোমবাতিতে ফুঁ দে (আসল নাই)",
  blowText: "ফুঁ দে 🌬",
  wishText: "আসল কেইক পাইমু কই, এটাই বেটার ✨",

  endLine: "Many Happy Returns",
  endSub:  "জাস্ট এতটুকুই 💖",
  replayText: "আবার দেখ 🔁"
};
/* ===================================================== */

const PHOTOS = ["photo1.png","photo2.png","photo3.png","photo4.png","photo5.png","photo6.png","photo7.png"];
const $ = id => document.getElementById(id);
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const mk = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; };

$("gateTitle").textContent = CONFIG.gateTitle;
$("openBtn").textContent = CONFIG.openText;

/* floating hearts + twinkles */
const ICONS = ["💖","💗","💕","🌸","💝","🎀"];
function spawn(){
  const h = document.createElement("span");
  h.className = "fl"; h.textContent = ICONS[Math.floor(Math.random()*ICONS.length)];
  h.style.left = Math.random()*100 + "vw"; h.style.fontSize = (14 + Math.random()*20) + "px";
  h.style.animationDuration = (8 + Math.random()*7) + "s";
  $("fx").appendChild(h); setTimeout(() => h.remove(), 16000);
}
setInterval(spawn, 800);
for (let i = 0; i < 22; i++){
  const t = document.createElement("i"); t.className = "tw";
  t.style.left = Math.random()*100 + "%"; t.style.top = Math.random()*100 + "%";
  t.style.animationDelay = (Math.random()*3) + "s"; $("fx").appendChild(t);
}

/* confetti */
const cv = $("confetti"), cx = cv.getContext("2d");
let bits = [], running = false;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", sizeCv); sizeCv();
function burst(x = innerWidth/2, y = innerHeight*0.5, n = 150){
  const colors = ["#e8467c","#ff9ec0","#ffd1e1","#ffffff","#a3225a","#ffc86b"];
  for (let i = 0; i < n; i++) bits.push({x, y, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4, s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:colors[i%colors.length], life:140+Math.random()*60});
  if (!running){ running = true; loop(); }
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b => b.life-- > 0);
  bits.forEach(b => { b.vy += .35; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vx *= .99;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.globalAlpha = Math.min(1, b.life/40); cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); cx.restore(); });
  if (bits.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------- frames ---------- */
const frames = [];
const stage = $("stage");
function addFrame(cls, html, dur, enter){
  const el = mk("fr " + cls, html); stage.insertBefore(el, $("bars")); frames.push({el, dur, enter}); return el;
}

// 1. hero
addFrame("hero", '<div class="orb"></div><div class="top script"></div><h2 class="grad"></h2><div class="nm hand"></div><div class="sub"><span id="typed"></span><span class="cur"></span></div>', 7000, () => {
  burst(); setTimeout(burst, 700); typeLine();
});
const hf = frames[0].el;
hf.querySelector(".top").textContent = CONFIG.topLine;
hf.querySelector("h2").textContent = CONFIG.bigTitle;
hf.querySelector(".nm").textContent = CONFIG.friendName;
let typing = 0;
function typeLine(){
  const el = $("typed"), t = CONFIG.typedLine, id = ++typing; let i = 0; el.textContent = "";
  (function step(){ if (id !== typing) return; el.textContent = t.slice(0, ++i); if (i < t.length) setTimeout(step, 140); })();
}

// 2. photos (story style)
PHOTOS.forEach((src, i) => {
  const f = addFrame("ph", '<div class="bg"></div><div class="pic"><img alt=""></div><div class="cap hand"></div><div class="no"></div>', CONFIG.photoSeconds*1000);
  f.querySelector(".bg").style.backgroundImage = 'url("' + src + '")';
  f.querySelector("img").src = src;
  f.querySelector(".cap").textContent = CONFIG.captions[i] || "";
  f.querySelector(".no").textContent = bn(i+1) + " / " + bn(PHOTOS.length);
});

// 3. letter
const lf = addFrame("lt", '<div class="paper"><h3 class="hand"></h3></div>', 0);
lf.querySelector("h3").textContent = CONFIG.letterTitle;
CONFIG.letter.forEach((t, i) => {
  const p = document.createElement("p"); p.textContent = t; p.style.animationDelay = (0.6 + i*1.2) + "s";
  lf.querySelector(".paper").appendChild(p);
});
lf.querySelector("h3").style.animationDelay = ".1s";

// 4. balloons
const bf = addFrame("bf", '<h3 class="t hand"></h3><div class="balloons" id="balloons"></div><div id="pmsg" class="hand"></div><div id="pcnt"></div>', 0);
bf.querySelector("h3").textContent = CONFIG.balloonsTitle;
const BCOL = ["#ff7fab","#ffa94d","#c77dff","#5fd3c4","#ff5d8f","#ffd36b"];
let popped = 0; const total = CONFIG.balloonMsgs.length;
const cntTxt = () => "ট্যাপ করে বেলুন ফুটা — " + bn(popped) + "/" + bn(total);
$("pcnt").textContent = cntTxt();
CONFIG.balloonMsgs.forEach((m, i) => {
  const b = document.createElement("button");
  b.className = "bl"; b.setAttribute("aria-label", "বেলুন");
  b.style.left = (2 + i*(72/Math.max(total-1,1))) + "%";
  b.style.bottom = (96 + (i%2)*55 + (i%3)*12) + "px";
  b.style.background = BCOL[i % BCOL.length]; b.style.animationDelay = (i*0.5) + "s";
  b.addEventListener("click", () => {
    if (b.classList.contains("pop")) return;
    b.classList.add("pop"); popped++;
    $("pmsg").textContent = m;
    $("pcnt").textContent = popped === total ? "সবগুলো ফুটিয়ে ফেললি 🎉" : cntTxt();
    const r = b.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, popped === total ? 200 : 50);
  });
  $("balloons").appendChild(b);
});

// 5. cake
const cf = addFrame("cf", `<div id="cakeQ"></div>
<svg class="cake" id="cake" viewBox="0 0 260 250" aria-hidden="true">
<ellipse cx="130" cy="228" rx="118" ry="14" fill="#ffb3cd"/><rect x="30" y="150" width="200" height="74" rx="14" fill="#ff8fb5"/>
<path d="M30 164q14 18 28 0t28 0 28 0 28 0 28 0 28 0 28 0v-2a14 14 0 0 0-14-12H44a14 14 0 0 0-14 12z" fill="#fff"/>
<rect x="62" y="96" width="136" height="58" rx="12" fill="#ffa9c6"/>
<path d="M62 110q11 16 22 0t22 0 22 0 22 0 22 0 22 0v-1a12 12 0 0 0-12-11H74a12 12 0 0 0-12 11z" fill="#fff"/>
<circle cx="60" cy="190" r="5" fill="#fff"/><circle cx="100" cy="196" r="5" fill="#ffd3e3"/><circle cx="140" cy="190" r="5" fill="#fff"/><circle cx="180" cy="196" r="5" fill="#ffd3e3"/><circle cx="214" cy="190" r="5" fill="#fff"/>

$("cakeQ").textContent = CONFIG.cakeQ;
$("blowBtn").textContent = CONFIG.blowText;
$("blowBtn").addEventListener("click", () => {
  const cake = $("cake"); if (cake.classList.contains("blown")) return;
  cake.classList.add("blown"); $("wishmsg").textContent = CONFIG.wishText; $("blowBtn").style.display = "none";
  const r = cake.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height*0.3, 180);
});

// 6. end
const ef = addFrame("end", '<div class="big script grad"></div><p></p><button class="btn"></button>', 0, () => { burst(); setTimeout(burst, 600); });
ef.querySelector(".big").textContent = CONFIG.endLine;
ef.querySelector("p").textContent = CONFIG.endSub;
ef.querySelector(".btn").textContent = CONFIG.replayText;
ef.querySelector(".btn").addEventListener("click", () => go(0));

/* ---------- navigation ---------- */
const barsEl = $("bars");
const bars = frames.map(() => { const b = mk("bar", "<i></i>"); barsEl.appendChild(b); return b.firstChild; });
let cur = -1, elapsed = 0, paused = false;
function go(i){
  if (i < 0 || i >= frames.length) return;
  cur = i; elapsed = 0;
  frames.forEach((f, k) => f.el.classList.toggle("on", k === i));
  bars.forEach((b, k) => b.style.width = (k < i || (k === i && !frames[i].dur)) ? "100%" : "0");
  document.body.classList.toggle("manual", !frames[i].dur);
  if (frames[i].enter) frames[i].enter();
}
const nextF = () => go(cur + 1), prevF = () => go(cur - 1);
["zr","next"].forEach(id => $(id).addEventListener("click", nextF));
["zl","prev"].forEach(id => $(id).addEventListener("click", prevF));
setInterval(() => {
  if (cur < 0 || paused) return;
  const d = frames[cur].dur; if (!d) return;
  elapsed += 50; bars[cur].style.width = Math.min(100, elapsed/d*100) + "%";
  if (elapsed >= d) nextF();
}, 50);
// hold to pause (only on photo/hero), swipe to navigate
let sx = null;
stage.addEventListener("pointerdown", e => { if (!e.target.closest("button")) paused = true; });
["pointerup","pointercancel"].forEach(ev => addEventListener(ev, () => paused = false));
stage.addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
stage.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 55) (dx < 0 ? nextF : prevF)(); });
addEventListener("keydown", e => { if (e.key === "ArrowRight") nextF(); if (e.key === "ArrowLeft") prevF(); });

/* ---------- gate → intro → stage ---------- */
const song = $("song"), mute = $("mute");
let started = false;
function showStage(){ stage.classList.add("show"); go(0); }
function playStory(done){
  const st = $("story"), n = CONFIG.intro.length, timers = [];
  st.innerHTML = "";
  const els = CONFIG.intro.map(t => { const d = mk("sl", ""); d.textContent = t; st.appendChild(d); return d; });
  const skip = document.createElement("button"); skip.className = "skip"; skip.textContent = "এড়িয়ে যাও ›"; st.appendChild(skip);
  let finished = false;
  function finish(){ if (finished) return; finished = true; timers.forEach(clearTimeout); st.classList.remove("on"); setTimeout(done, 500); }
  skip.addEventListener("click", finish);
  st.classList.add("on");
  els.forEach((el, i) => timers.push(setTimeout(() => { if (i) els[i-1].classList.remove("show"); el.classList.add("show"); }, 1500 + i*3200)));
  timers.push(setTimeout(finish, 1500 + n*3200 + 1200));
}
$("openBtn").addEventListener("click", () => {
  if (started) return; started = true;
  song.volume = 0.9; song.play().catch(() => {});
  $("gate").classList.add("gone"); mute.classList.add("show");
  setTimeout(() => playStory(showStage), 500);
});
mute.addEventListener("click", () => {
  if (song.paused){ song.play(); mute.textContent = "🔊"; } else { song.pause(); mute.textContent = "🔇"; }
});
</script>
